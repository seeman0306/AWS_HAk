<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" rx="16" fill="#0f172a"/>
  <!-- Road lanes -->
  <rect x="0" y="120" width="400" height="80" fill="#1e293b"/>
  <rect x="0" y="118" width="400" height="4" fill="#334155"/>
  <!-- Lane dividers -->
  <rect x="130" y="120" width="3" height="80" fill="#334155"/>
  <rect x="265" y="120" width="3" height="80" fill="#334155"/>

  <!-- Traffic signal post -->
  <rect x="193" y="50" width="14" height="70" rx="2" fill="#334155"/>
  <!-- Signal box -->
  <rect x="180" y="20" width="40" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Red light (active) -->
  <circle cx="200" cy="35" r="10" fill="#dc2626"/>
  <circle cx="200" cy="35" r="7" fill="#ef4444"/>
  <!-- Amber light (off) -->
  <circle cx="200" cy="52" r="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <!-- Green light (off) -->
  <circle cx="200" cy="69" r="10" fill="#1e293b" stroke="#374151" stroke-width="1"/>

  <!-- Cars in congestion - row 1 -->
  <!-- Car 1 (red) -->
  <rect x="14" y="127" width="52" height="28" rx="5" fill="#dc2626"/>
  <rect x="20" y="130" width="40" height="14" rx="3" fill="#374151" opacity="0.7"/>
  <circle cx="20" cy="157" r="6" fill="#111"/>
  <circle cx="60" cy="157" r="6" fill="#111"/>
  <!-- Car 2 (blue) -->
  <rect x="80" y="127" width="52" height="28" rx="5" fill="#2563eb"/>
  <rect x="86" y="130" width="40" height="14" rx="3" fill="#374151" opacity="0.7"/>
  <circle cx="86" cy="157" r="6" fill="#111"/>
  <circle cx="126" cy="157" r="6" fill="#111"/>

  <!-- Cars in congestion - row 2 -->
  <!-- Car 3 (white) -->
  <rect x="143" y="127" width="52" height="28" rx="5" fill="#e2e8f0"/>
  <rect x="149" y="130" width="40" height="14" rx="3" fill="#94a3b8" opacity="0.7"/>
  <circle cx="149" cy="157" r="6" fill="#111"/>
  <circle cx="189" cy="157" r="6" fill="#111"/>

  <!-- Cars row 3 -->
  <!-- Car 4 (yellow) -->
  <rect x="275" y="127" width="52" height="28" rx="5" fill="#eab308"/>
  <rect x="281" y="130" width="40" height="14" rx="3" fill="#374151" opacity="0.7"/>
  <circle cx="281" cy="157" r="6" fill="#111"/>
  <circle cx="321" cy="157" r="6" fill="#111"/>

  <!-- Car 5 (silver) -->
  <rect x="340" y="127" width="52" height="28" rx="5" fill="#94a3b8"/>
  <rect x="346" y="130" width="40" height="14" rx="3" fill="#374151" opacity="0.7"/>
  <circle cx="346" cy="157" r="6" fill="#111"/>
  <circle cx="386" cy="157" r="6" fill="#111"/>

  <!-- Brake lights glow -->
  <rect x="14" y="148" width="8" height="5" rx="1" fill="#ef4444" opacity="0.9"/>
  <rect x="60" y="148" width="8" height="5" rx="1" fill="#ef4444" opacity="0.9"/>
  <rect x="80" y="148" width="8" height="5" rx="1" fill="#ef4444" opacity="0.9"/>
  <rect x="126" y="148" width="8" height="5" rx="1" fill="#ef4444" opacity="0.9"/>

  <!-- Alert label -->
  <rect x="220" y="25" width="160" height="44" rx="8" fill="#dc2626" opacity="0.15" stroke="#dc2626" stroke-width="1" opacity="0.6"/>
  <text x="300" y="44" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="800" font-family="sans-serif" letter-spacing="1">CONGESTION DETECTED</text>
  <text x="300" y="60" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600" font-family="sans-serif">42 VEHICLES · HIGH</text>
</svg>
