<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Sky background - night -->
  <defs>
    <radialGradient id="glow" cx="200" cy="60" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="200" rx="16" fill="#0f172a"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="80" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="130" cy="15" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="310" cy="25" r="1" fill="white" opacity="0.5"/>
  <circle cx="360" cy="12" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="50" cy="55" r="1" fill="white" opacity="0.4"/>
  <circle cx="350" cy="50" r="1" fill="white" opacity="0.4"/>

  <!-- Glow halo (should be lit but is not) -->
  <circle cx="200" cy="60" r="55" fill="url(#glow)" opacity="0.5"/>

  <!-- Street lamp pole -->
  <rect x="196" y="60" width="8" height="120" rx="2" fill="#334155"/>
  <!-- Lamp arm -->
  <path d="M200 60 Q200 45 215 45 L230 45" stroke="#334155" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Lamp head (off / dark) -->
  <rect x="218" y="38" width="32" height="16" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- X indicator - light off -->
  <line x1="228" y1="43" x2="240" y2="53" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="43" x2="228" y2="53" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Road below -->
  <rect x="0" y="140" width="400" height="60" rx="0" fill="#1e293b"/>
  <!-- Dark road - no light -->
  <rect x="0" y="138" width="400" height="4" fill="#334155"/>

  <!-- Warning icon -->
  <circle cx="120" cy="90" r="22" fill="#f59e0b" opacity="0.15"/>
  <circle cx="120" cy="90" r="18" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <text x="120" y="98" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="900" font-family="sans-serif">!</text>

  <!-- Label -->
  <text x="240" y="85" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="800" font-family="sans-serif" letter-spacing="1">LIGHT FAILURE</text>
  <text x="240" y="103" text-anchor="middle" fill="#78716c" font-size="10" font-weight="600" font-family="sans-serif" letter-spacing="1">CIRCUIT FAULT · INOPERATIVE</text>
</svg>
