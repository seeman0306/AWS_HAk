version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: civiceye_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civiceye_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

  civiceye-api:
    build: .
    container_name: civiceye_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/civiceye_db
      - PORT=5000
      - DEMO_MODE=true
    depends_on:
      - postgres

volumes:
  pgdata:
